<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>政策走向分析 - 政务新闻聚合平台</title>
<link rel="stylesheet" href="/ui.css">
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>window.echarts || document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"><\/script>')</script>
<style>
  .page { max-width: 1100px; margin: var(--sp-5) auto 0; padding: 0 var(--sp-6) 64px; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: var(--sp-4); flex-wrap: wrap; }
  .toolbar .hint { font-size: 12.5px; color: var(--text-3); }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
  .chart-card { background: var(--bg-card); border: 1px solid var(--border-2); border-radius: var(--r-lg); padding: var(--sp-5); }
  .chart-card h2 {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 var(--sp-3); font-size: 15px; font-weight: 600;
  }
  .chart-card h2::before { content: ""; width: 4px; height: 15px; border-radius: 2px; background: var(--brand-600); }
  .chart { width: 100%; height: 300px; }
  .chart-card.wide { grid-column: 1 / -1; }
  /* 上升话题列表 */
  .rise-item { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border-2); font-size: 13.5px; }
  .rise-item:last-child { border-bottom: 0; }
  .rise-rank { flex: none; width: 22px; height: 22px; border-radius: 6px; background: #F2F3F5; color: var(--text-2);
               font-size: 12px; display: flex; align-items: center; justify-content: center; }
  .rise-item:nth-child(1) .rise-rank { background: var(--brand-100); color: var(--brand-600); font-weight: 600; }
  .rise-tag { font-weight: 600; min-width: 90px; }
  .rise-desc { color: var(--text-3); font-size: 12.5px; flex: 1; }
  .rise-delta { font-weight: 600; color: var(--ok); font-variant-numeric: tabular-nums; }
  .rise-delta.down { color: var(--text-3); }
  .kpi-row { display: flex; gap: var(--sp-3); margin-bottom: var(--sp-4); }
  .kpi { flex: 1; background: var(--bg-card); border: 1px solid var(--border-2); border-radius: var(--r-md); padding: 14px 18px; }
  .kpi b { display: block; font-size: 24px; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 12px; color: var(--text-3); }
  @media (max-width: 860px) { .chart-grid { grid-template-columns: 1fr; } .kpi-row { flex-wrap: wrap; } .kpi { min-width: 45%; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="brand">
    <span class="brand-mark">政</span>
    <h1>政策走向分析</h1>
    <span class="brand-sub">基于 AI 标签与解读数据</span>
  </div>
  <nav class="site-nav">
    <a href="/">返回新闻流</a>
    <a href="/admin">后台管理</a>
  </nav>
</header>

<main class="page">
  <div class="toolbar">
    <label style="font-size:13px;color:var(--text-2)">统计范围
      <select id="days" style="margin-left:6px" onchange="loadTrends()">
        <option value="7">近 7 天</option>
        <option value="30" selected>近 30 天</option>
        <option value="90">近 90 天</option>
      </select>
    </label>
    <span class="hint" id="gen-at"></span>
    <span class="hint">趋势基于 AI 自动打的主题标签聚合，标签质量随数据量增长而更准</span>
  </div>

  <div class="kpi-row" id="kpis"></div>

  <div id="err" class="state" style="display:none">加载失败，请稍后重试</div>
  <div id="charts" class="chart-grid" style="display:none">
    <div class="chart-card wide"><h2>主题热度趋势</h2><div class="chart" id="c-topics"></div></div>
    <div class="chart-card"><h2>每日发布量</h2><div class="chart" id="c-daily"></div></div>
    <div class="chart-card"><h2>内容类型分布</h2><div class="chart" id="c-types"></div></div>
    <div class="chart-card wide"><h2>各地市活跃度</h2><div class="chart" id="c-city" style="height:340px"></div></div>
    <div class="chart-card wide"><h2>上升话题（近 7 天 vs 前 7 天）</h2><div id="rising"></div></div>
  </div>
</main>

<script>
const TOKEN = localStorage.getItem("nb_token");
if (!TOKEN) location.href = "/login.html";
const H = {"Authorization": "Bearer " + TOKEN};
const PALETTE = ["#C0181F","#2B6CB0","#2F7A45","#B0651A","#7C3AED","#0891B2","#DB2777","#65A30D"];

let charts = [];

function makeChart(id) {
  const el = document.getElementById(id);
  const c = echarts.init(el);
  charts.push(c);
  return c;
}
window.addEventListener("resize", () => charts.forEach(c => c.resize()));

async function loadTrends() {
  document.getElementById("err").style.display = "none";
  document.getElementById("charts").style.display = "none";
  const days = document.getElementById("days").value;
  const r = await fetch(`/api/trends?days=${days}`, {headers: H});
  if (r.status === 401) { localStorage.removeItem("nb_token"); location.href = "/login.html"; return; }
  if (!r.ok) { document.getElementById("err").style.display = ""; return; }
  const d = await r.json();
  document.getElementById("gen-at").textContent =
    `共 ${d.total} 条 · 生成于 ${(d.generated_at || "").replace("T", " ")}`;
  renderKpis(d);
  renderTopics(d);
  renderDaily(d);
  renderTypes(d);
  renderCity(d);
  renderRising(d);
  document.getElementById("charts").style.display = "";
}

function renderKpis(d) {
  const sum = arr => arr.reduce((a, x) => a + x.n, 0);
  const cities = d.city_totals.length, topics = d.topics.length;
  const policies = (d.type_totals.find(t => t.type === "policy" || t.type === "interpretation") || {}).n || 0;
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><b>${d.total}</b><span>统计范围内新闻</span></div>
    <div class="kpi"><b>${cities}</b><span>活跃地市</span></div>
    <div class="kpi"><b>${topics}</b><span>热门主题标签</span></div>
    <div class="kpi"><b>${policies}</b><span>政策类内容</span></div>`;
}

function renderTopics(d) {
  const c = makeChart("c-topics");
  const dates = d.daily.map(x => x.date.slice(5));  // MM-DD
  const series = d.topics.map((t, i) => ({
    name: t.tag, type: "line", smooth: true, symbolSize: 5,
    data: t.series.map(s => s.n),
    itemStyle: {color: PALETTE[i % PALETTE.length]}, lineStyle: {width: 2},
  }));
  c.setOption({
    tooltip: {trigger: "axis"},
    legend: {type: "scroll", bottom: 0, textStyle: {color: "#51565D", fontSize: 12}},
    grid: {left: 40, right: 20, top: 20, bottom: 56},
    xAxis: {type: "category", data: dates, axisLine: {lineStyle: {color: "#E5E6EB"}},
            axisLabel: {color: "#8F959E"}},
    yAxis: {type: "value", minInterval: 1, splitLine: {lineStyle: {color: "#F0F1F4"}},
            axisLabel: {color: "#8F959E"}},
    series,
  });
}

function renderDaily(d) {
  const c = makeChart("c-daily");
  c.setOption({
    tooltip: {trigger: "axis"},
    grid: {left: 40, right: 20, top: 20, bottom: 32},
    xAxis: {type: "category", data: d.daily.map(x => x.date.slice(5)),
            axisLine: {lineStyle: {color: "#E5E6EB"}}, axisLabel: {color: "#8F959E"}},
    yAxis: {type: "value", minInterval: 1, splitLine: {lineStyle: {color: "#F0F1F4"}},
            axisLabel: {color: "#8F959E"}},
    series: [{
      type: "bar", data: d.daily.map(x => x.n), barMaxWidth: 26,
      itemStyle: {color: "#2B6CB0", borderRadius: [4, 4, 0, 0]},
    }],
  });
}

function renderTypes(d) {
  const c = makeChart("c-types");
  c.setOption({
    tooltip: {trigger: "item", formatter: "{b}：{c} 条（{d}%）"},
    legend: {bottom: 0, textStyle: {color: "#51565D", fontSize: 12}},
    series: [{
      type: "pie", radius: ["42%", "68%"], center: ["50%", "44%"],
      data: d.type_totals.map((t, i) => ({
        name: t.label, value: t.n,
        itemStyle: {color: PALETTE[i % PALETTE.length]},
      })),
      label: {color: "#51565D", fontSize: 12, formatter: "{b}\n{c}"},
    }],
  });
}

function renderCity(d) {
  const c = makeChart("c-city");
  const sorted = [...d.city_totals].reverse();  // 横向条形从小到大
  c.setOption({
    tooltip: {trigger: "axis", axisPointer: {type: "shadow"}},
    grid: {left: 80, right: 40, top: 10, bottom: 24},
    xAxis: {type: "value", minInterval: 1, splitLine: {lineStyle: {color: "#F0F1F4"}},
            axisLabel: {color: "#8F959E"}},
    yAxis: {type: "category", data: sorted.map(x => x.city), axisLabel: {color: "#51565D"},
            axisLine: {lineStyle: {color: "#E5E6EB"}}},
    series: [{
      type: "bar", data: sorted.map(x => x.n), barMaxWidth: 16,
      itemStyle: {color: "#C0181F", borderRadius: [0, 4, 4, 0]},
      label: {show: true, position: "right", color: "#8F959E", fontSize: 11},
    }],
  });
}

function renderRising(d) {
  const el = document.getElementById("rising");
  if (!d.rising.length) { el.innerHTML = '<div class="state" style="padding:32px 0">数据还不足两个周期，积累几天后这里会出现上升话题</div>'; return; }
  el.innerHTML = d.rising.map((r, i) => {
    const dir = r.delta >= 0;
    const desc = dir
      ? `近 7 天 ${r.recent} 条，前 7 天 ${r.previous} 条`
      : `近 7 天 ${r.recent} 条，前 7 天 ${r.previous} 条，热度回落`;
    return `<div class="rise-item">
      <span class="rise-rank">${i + 1}</span>
      <span class="rise-tag">${r.tag}</span>
      <span class="rise-desc">${desc}</span>
      <span class="rise-delta ${dir ? "" : "down"}">${dir ? "+" : ""}${r.delta} 条</span>
    </div>`;
  }).join("");
}

loadTrends();
</script>
</body>
</html>
